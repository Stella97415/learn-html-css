<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>순서형, 비순서형 목록</title>
  </head>
  <body>
    <h1>목록</h1>
    <h2>비순서형 목록</h2>
    <!--순서가 상관 없는 독립된 아이템을 포함할 수 있는 목록-->
    <h3>다양한 메뉴를 카페 W에서 즐겨보세요.</h3>
    <ul type="circle">
      <li>카페 w만의 특별함</li>
      <li>카페 w 커피와 완벽한 어울림을 자랑하는 원두</li>
      <li>사용한</li>
      <li>소중한</li>
      <li>카페 w 카드</li>
    </ul>
    <!--순서가 중요한 독립된 아이템을 포함할 수 있는 목록-->
    <h3>카페 W 인기 강좌</h3>
    <ol>
      <li>UI 구조</li>
      <li>모바일 웹</li>
      <li>UI 인터랙션</li>
      <li>react</li>
    </ol>
  </body>
</html>
